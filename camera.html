<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen Z Camera - Polaroid Frame</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #05080f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            color: white;
        }

        .container {
            position: relative;
            width: 95vw;
            max-width: 900px;
            aspect-ratio: 16 / 10;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
            border-radius: 20px;
        }

        video {
            display: none;
        }

        /* 
          ĐÃ CĂN CHỈNH: Tỷ lệ & Tọa độ Camera (canvas) nằm khớp tuyệt đối
          vào lòng ô trắng của khung Polaroid khi khung ở mức 300% x 270%.
        */
       canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); border-radius: 20px; }

        /* Ảnh hiệu ứng được đặt ở giữa vùng camera */
        #overlay-img {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 35%;
            max-height: 35%;
            display: none;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s ease-in-out;
            z-index: 2;
        }

        #overlay-img.show {
            display: block;
            opacity: 1;
        }

        /* KHUNG POLAROID 300% x 270% - CĂN CHÍNH GIỮA */
        #frame-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300%;
            height: 270%;
            object-fit: contain;
            object-position: center;
            pointer-events: none;
            z-index: 3;
        }

        #status {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: #0f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #0f0;
            z-index: 4;
        }

        @media (max-width: 768px) {
            .container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                aspect-ratio: auto;
                border-radius: 0;
            }

            #overlay-img {
                left: 50%;
                top: 50%;
            }

            #status {
                top: 12px;
                left: 12px;
                font-size: 12px;
                padding: 7px 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <video id="webcam" autoplay playsinline></video>

    <!-- Hình ảnh camera nằm bên dưới lớp khung -->
    <canvas id="output_canvas"></canvas>

    <!-- Ảnh hiệu ứng biểu cảm / cử chỉ tay -->
    <img id="overlay-img" src="" alt="Effect">

    <!-- Khung Polaroid nằm trên camera -->
    <img id="frame-img" src="khung.png" alt="Polaroid frame">

    <div id="status">ĐANG KHỞI ĐỘNG CAMERA...</div>
</div>

<script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const overlayImg = document.getElementById('overlay-img');
    const statusDiv = document.getElementById('status');

    const images = {
        anh1: "anh1.png",
        anh5: "anh5.png",
        anh6: "anh6.png",
        anh7: "anh7.png",
        anh10: "anh10.png"
    };

    let currentAction = null;
    let pendingAction = null;
    let stabilityCounter = 0;
    let handStabilityCounter = 0;

    const HAND_STABILITY_THRESHOLD = 5;

    function updateDisplay(key) {
        if (!key) {
            stabilityCounter = 0;

            if (currentAction === 'anh6') {
                handStabilityCounter++;

                if (handStabilityCounter >= HAND_STABILITY_THRESHOLD) {
                    currentAction = null;
                    pendingAction = null;
                    overlayImg.classList.remove('show');
                    statusDiv.innerText = "SẴN SÀNG! HÃY BIỂU CẢM HOẶC DÙNG TAY";
                    statusDiv.style.color = "#0f0";
                    statusDiv.style.borderColor = "#0f0";
                    handStabilityCounter = 0;
                }
                return;
            }

            if (currentAction !== null) {
                overlayImg.classList.remove('show');
                statusDiv.innerText = "SẴN SÀNG! HÃY BIỂU CẢM HOẶC DÙNG TAY";
                statusDiv.style.color = "#0f0";
                statusDiv.style.borderColor = "#0f0";
                currentAction = null;
                pendingAction = null;
            }
            return;
        }

        if (pendingAction === key) {
            stabilityCounter++;

            if (key === 'anh6') {
                if (stabilityCounter >= HAND_STABILITY_THRESHOLD && currentAction !== 'anh6') {
                    showEffect(key);
                }
                return;
            }

            if (stabilityCounter >= 2 && currentAction !== key) {
                showEffect(key);
            }
        } else {
            pendingAction = key;
            stabilityCounter = 1;

            if (key !== 'anh6') {
                handStabilityCounter = 0;
            }
        }
    }

    function showEffect(key) {
        overlayImg.src = images[key];
        overlayImg.classList.add('show');

        statusDiv.innerText = `ĐANG HIỂN THỊ: ${key.toUpperCase()}`;
        statusDiv.style.color = "#ff0";
        statusDiv.style.borderColor = "#ff0";

        currentAction = key;
    }

    let resultsFace = null;
    let resultsHands = null;

    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
        resultsFace = results;
    });

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
        resultsHands = results;
    });

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            if (!videoElement.videoWidth || !videoElement.videoHeight) {
                return;
            }

            if (
                canvasElement.width !== videoElement.videoWidth ||
                canvasElement.height !== videoElement.videoHeight
            ) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            await hands.send({ image: videoElement });
            await faceMesh.send({ image: videoElement });

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(
                videoElement,
                0,
                0,
                canvasElement.width,
                canvasElement.height
            );

            let detectedKey = null;

            // Nhận diện cử chỉ tay
            if (
                resultsHands &&
                resultsHands.multiHandLandmarks &&
                resultsHands.multiHandLandmarks.length > 0
            ) {
                const handsData = resultsHands.multiHandLandmarks;

                // Hai cổ tay gần nhau: anh6
                if (handsData.length >= 2) {
                    const wristDistance = Math.hypot(
                        handsData[0][0].x - handsData[1][0].x,
                        handsData[0][0].y - handsData[1][0].y
                    );

                    if (wristDistance < 0.4) {
                        detectedKey = 'anh6';
                    }
                }

                // Ngón trỏ và ngón giữa hướng lên, đầu ngón gần nhau: anh7
                if (!detectedKey) {
                    for (const hand of handsData) {
                        const indexTip = hand[8];
                        const middleTip = hand[12];

                        const indexMiddleDistance = Math.hypot(
                            indexTip.x - middleTip.x,
                            indexTip.y - middleTip.y
                        );

                        if (
                            indexTip.y < hand[6].y &&
                            middleTip.y < hand[10].y &&
                            indexMiddleDistance < 0.08
                        ) {
                            detectedKey = 'anh7';
                            break;
                        }
                    }
                }
            }

            // Nhận diện biểu cảm khuôn mặt nếu chưa nhận diện được cử chỉ tay
            if (
                !detectedKey &&
                resultsFace &&
                resultsFace.multiFaceLandmarks &&
                resultsFace.multiFaceLandmarks.length > 0
            ) {
                const landmarks = resultsFace.multiFaceLandmarks[0];

                const mouthOpen = Math.abs(landmarks[13].y - landmarks[14].y);
                const lipDiff = Math.abs(landmarks[61].y - landmarks[291].y);
                const eyeLeft = Math.abs(landmarks[159].y - landmarks[145].y);
                const eyeRight = Math.abs(landmarks[386].y - landmarks[374].y);

                if (mouthOpen > 0.08) {
                    detectedKey = 'anh5';
                } else if (lipDiff > 0.02) {
                    detectedKey = 'anh1';
                } else if (eyeLeft < 0.015 && eyeRight < 0.015) {
                    detectedKey = 'anh10';
                }
            }

            updateDisplay(detectedKey);
            canvasCtx.restore();
        },
        width: 1280,
        height: 720
    });

    camera.start()
        .then(() => {
            statusDiv.innerText = "CAMERA ĐÃ SẴN SÀNG!";
        })
        .catch((err) => {
            statusDiv.innerText = "LỖI CAMERA: " + err;
            statusDiv.style.color = "red";
            statusDiv.style.borderColor = "red";
        });
</script>

</body>
</html>
